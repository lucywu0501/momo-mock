name: Feature request
description: 提出新功能或改進
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議做法
  - type: textarea
    id: alternatives
    attributes:
      label: 考慮過的替代方案
